<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FleetTracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="reports">
<div id="nav"></div>
<div class="container mt-3" id="msg"></div>
<main class="container py-4">
  <h3>Cost report</h3>
  <div class="card card-body mb-4"><canvas id="chart" height="90"></canvas></div>
  <div class="table-responsive table-wrap"><table class="table table-striped">
    <thead><tr><th>Vehicle</th><th>Fuel cost</th><th>Service cost</th><th>Distance (km)</th><th>Avg km/l</th><th>Cost per km</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</main>
<footer class="text-center text-muted py-4 small">Fleet Maintenance &amp; Fuel Tracker</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="js/app.js"></script>
</body></html>
