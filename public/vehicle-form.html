<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FleetTracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="vehicle-form">
<div id="nav"></div>
<div class="container mt-3" id="msg"></div>
<main class="container py-4" style="max-width:640px">
  <h3 id="title">Add vehicle</h3>
  <form id="vehicleForm" class="card card-body">
    <label class="form-label">Registration no</label>
    <input name="reg_no" class="form-control mb-2" required>
    <label class="form-label">Type</label>
    <select name="type" class="form-select mb-2"><option>Truck</option><option>Bus</option><option>CNG</option><option>Car</option><option>Bike</option></select>
    <label class="form-label">Model</label>
    <input name="model" class="form-control mb-2">
    <div id="mileageGroup">
      <label class="form-label">Current mileage (km)</label>
      <input type="number" name="mileage" min="0" value="0" class="form-control mb-2">
    </div>
    <label class="form-label">Service every (km)</label>
    <input type="number" name="service_interval_km" min="500" value="5000" class="form-control mb-2">
    <label class="form-label">Driver email (optional)</label>
    <input type="email" name="driver_email" id="driver_email" list="driverList" class="form-control mb-2" placeholder="driver@demo.com">
    <datalist id="driverList"></datalist>
    <label class="form-label">Status</label>
    <select name="status" class="form-select mb-3"><option>Active</option><option>In Service</option><option>Inactive</option></select>
    <button class="btn btn-primary">Save</button>
  </form>
</main>
<footer class="text-center text-muted py-4 small">Fleet Maintenance &amp; Fuel Tracker</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/app.js"></script>
</body></html>
