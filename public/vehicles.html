<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FleetTracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="vehicles">
<div id="nav"></div>
<div class="container mt-3" id="msg"></div>
<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Vehicles</h3><a href="vehicle-form.html" class="btn btn-primary">+ Add vehicle</a>
  </div>
  <form id="filterForm" class="row g-2 mb-3">
    <div class="col-md-6"><input name="search" class="form-control" placeholder="Search reg no or model"></div>
    <div class="col-md-3"><select name="status" class="form-select">
      <option value="">All statuses</option><option>Active</option><option>In Service</option><option>Inactive</option>
    </select></div>
    <div class="col-md-3"><button class="btn btn-dark w-100">Filter</button></div>
  </form>
  <div class="table-responsive table-wrap"><table class="table table-striped align-middle">
    <thead><tr><th>Reg No</th><th>Type</th><th>Model</th><th>Mileage</th><th>Driver</th><th>Status</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</main>
<footer class="text-center text-muted py-4 small">Fleet Maintenance &amp; Fuel Tracker</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/app.js"></script>
</body></html>
