<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FleetTracker - Fuel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="fuel">
<div id="nav"></div>
<div class="container mt-3" id="msg"></div>

<main class="container py-4">
  <h3>Fuel log</h3>

  <form id="fuelForm" class="card card-body mb-4 d-none">
    <div class="small text-muted mb-2" id="lastInfo"></div>
    <div class="row g-2">
      <div class="col-md-3"><label class="form-label">Date</label><input type="date" name="log_date" class="form-control" required></div>
      <div class="col-md-2"><label class="form-label">Liters</label><input type="number" step="0.01" min="0.1" name="liters" class="form-control" required></div>
      <div class="col-md-3"><label class="form-label">Price per liter (৳)</label><input type="number" step="0.01" min="0.1" name="price" class="form-control" required></div>
      <div class="col-md-2"><label class="form-label">Odometer (km)</label><input type="number" min="0" name="odometer" class="form-control" required></div>
      <div class="col-md-2 d-flex align-items-end"><button class="btn btn-primary w-100">Save</button></div>
    </div>
    <div class="mt-3 p-2 bg-light rounded" id="preview">Fill in the numbers to see the calculation…</div>
  </form>

  <form id="fuelFilter" class="row g-2 mb-3">
    <div class="col-md-3 d-none" id="vehicleFilterBox"><select name="vehicle_id" id="f_vehicle" class="form-select"></select></div>
    <div class="col-6 col-md-3"><input type="date" name="from" class="form-control" title="From date"></div>
    <div class="col-6 col-md-3"><input type="date" name="to" class="form-control" title="To date"></div>
    <div class="col-md-3 d-flex gap-2">
      <button class="btn btn-dark flex-fill">Filter</button>
      <button type="button" class="btn btn-outline-secondary" id="clearFilter">Clear</button>
      <button type="button" class="btn btn-outline-success" id="csvBtn">CSV</button>
    </div>
  </form>

  <div class="row g-3 mb-3" id="summary"></div>
  <div id="alertBox"></div>

  <div class="row g-3 mb-4">
    <div class="col-md-6"><div class="card card-body"><h6>Monthly fuel cost</h6><canvas id="monthChart" height="160"></canvas></div></div>
    <div class="col-md-6"><div class="card card-body"><h6>Efficiency trend (km/l)</h6><canvas id="effChart" height="160"></canvas></div></div>
  </div>

  <div class="table-responsive table-wrap"><table class="table table-striped align-middle">
    <thead><tr><th>Date</th><th>Vehicle</th><th>Liters</th><th>Price/L</th><th>Total</th><th>Odometer</th><th>km/l</th><th>Cost/km</th><th>Status</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</main>

<footer class="text-center text-muted py-4 small">Fleet Maintenance &amp; Fuel Tracker</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="js/app.js"></script>
</body></html>
