<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FleetTracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="register">
<div id="nav"></div>
<div class="container mt-3" id="msg"></div>
<div class="container auth-box">
  <h3 class="mb-3">Create account</h3>
  <form id="registerForm" class="card card-body">
    <input name="name" class="form-control mb-2" placeholder="Full name" required>
    <input type="email" name="email" class="form-control mb-2" placeholder="Email" required>
    <input type="password" name="password" class="form-control mb-2" placeholder="Password (6+ chars)" minlength="6" required>
    <select name="role" class="form-select mb-3">
      <option value="owner">Vehicle Owner</option><option value="driver">Driver</option><option value="mechanic">Mechanic</option>
    </select>
    <button class="btn btn-primary">Register</button>
  </form>
</div>
<footer class="text-center text-muted py-4 small">Fleet Maintenance &amp; Fuel Tracker</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/app.js"></script>
</body></html>
