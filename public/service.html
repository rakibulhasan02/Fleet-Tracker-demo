<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FleetTracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="service">
<div id="nav"></div>
<div class="container mt-3" id="msg"></div>
<main class="container py-4">
  <h3 id="title">Service requests</h3>
  <form id="serviceForm" class="card card-body mb-4 d-none"><div class="row g-2">
    <div class="col-md-3"><select name="vehicle_id" id="vehicle_id" class="form-select" required></select></div>
    <div class="col-md-7"><input name="description" class="form-control" placeholder="Describe the problem or service needed" required></div>
    <div class="col-md-2"><button class="btn btn-primary w-100">Request</button></div>
  </div></form>
  <div id="jobs"></div>
</main>
<footer class="text-center text-muted py-4 small">Fleet Maintenance &amp; Fuel Tracker</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/app.js"></script>
</body></html>
